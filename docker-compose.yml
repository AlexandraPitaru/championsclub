services:
  frontend:
    build:
      context: ./championsclub-frontend
    container_name: championsclub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - championsclub-network

  backend:
    build:
      context: ./backend
    container_name: championsclub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTO_SEED: ${AUTO_SEED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SALES_SIMULATOR_ENABLED: ${SALES_SIMULATOR_ENABLED:-false}
      SALES_SIMULATOR_INTERVAL_SECONDS: ${SALES_SIMULATOR_INTERVAL_SECONDS:-300}
      SALES_SIMULATOR_MANAGER_ID: ${SALES_SIMULATOR_MANAGER_ID:-}
      SALES_SIMULATOR_ADVISOR_ID: ${SALES_SIMULATOR_ADVISOR_ID:-}
      SALES_SIMULATOR_BATCH_SIZE: ${SALES_SIMULATOR_BATCH_SIZE:-3}
      SALES_SIMULATOR_MAX_PRODUCTS_PER_SALE: ${SALES_SIMULATOR_MAX_PRODUCTS_PER_SALE:-2}
      SALES_SIMULATOR_POINTS_MULTIPLIER: ${SALES_SIMULATOR_POINTS_MULTIPLIER:-0.08}
      SALES_SIMULATOR_CREDIT_RATE: ${SALES_SIMULATOR_CREDIT_RATE:-0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-championsclub}:${POSTGRES_PASSWORD:-championsclub_dev_password}@postgres:5432/${POSTGRES_DB:-championsclub}
    volumes:
      - .:/app
    working_dir: /app/backend
    command: >
      sh -c "if [ \"$${APP_ENV}\" = \"development\" ]; then
        uvicorn app.main:app --reload --host 0.0.0.0 --port 8000;
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - championsclub-network

  postgres:
    image: postgres:16-alpine
    container_name: championsclub-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-championsclub}
      POSTGRES_USER: ${POSTGRES_USER:-championsclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-championsclub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-championsclub} -d ${POSTGRES_DB:-championsclub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - championsclub-network

networks:
  championsclub-network:
    name: championsclub-network

volumes:
  postgres_data: